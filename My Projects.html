<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f17; --surface: #161926; --surface2: #1e2235;
      --border: rgba(255,255,255,0.07); --accent: #7c6ef7; --accent2: #4fc3f7;
      --accent3: #f06292; --text: #e8eaf6; --muted: #7b82a4;
      --green: #4caf82; --orange: #f7a94e;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:40px 32px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:40px; flex-wrap:wrap; gap:16px; }
    .logo { display:flex; align-items:center; gap:12px; }
    .logo-icon { width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px; }
    .logo h1 { font-size:22px;font-weight:700;letter-spacing:-0.5px; }
    .logo p { font-size:13px;color:var(--muted);margin-top:2px; }
    .new-btn { display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),#5b52d8);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;box-shadow:0 4px 20px rgba(124,110,247,0.35); }
    .new-btn:hover { transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,110,247,0.5); }
    .stats { display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:32px; }
    .stat-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px; }
    .stat-card .val { font-size:28px;font-weight:800; }
    .stat-card .lbl { font-size:12px;color:var(--muted);margin-top:4px; }
    .stat-card.a .val{color:var(--accent)}.stat-card.b .val{color:var(--green)}.stat-card.c .val{color:var(--orange)}
    .toolbar { display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap; }
    .search-wrap { position:relative;flex:1;min-width:220px; }
    .search-wrap span { position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none; }
    #search { width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px 16px 12px 42px;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s; }
    #search:focus{border-color:var(--accent)}#search::placeholder{color:var(--muted)}
    .filter-btn { background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--muted);padding:10px 18px;font-size:13px;font-family:inherit;cursor:pointer;transition:all 0.15s; }
    .filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,110,247,0.08)}
    .section-title { font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px; }
    .grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:40px; }
    .card { background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;cursor:pointer;transition:transform 0.18s,border-color 0.18s,box-shadow 0.18s;position:relative;overflow:hidden; }
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color,var(--accent));border-radius:18px 18px 0 0;opacity:0;transition:opacity 0.2s}
    .card:hover{transform:translateY(-4px);border-color:rgba(124,110,247,0.4);box-shadow:0 12px 40px rgba(0,0,0,0.4)}.card:hover::before{opacity:1}
    .card-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card-bg,rgba(124,110,247,0.15));margin-bottom:14px}
    .card-name{font-size:15px;font-weight:700;margin-bottom:5px;line-height:1.3}
    .card-path{font-size:11px;color:var(--muted);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px}
    .card-tags{display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.06);color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .tag.flutter{background:rgba(79,195,247,0.12);color:var(--accent2)}.tag.web{background:rgba(246,169,78,0.12);color:var(--orange)}.tag.design{background:rgba(240,98,146,0.12);color:var(--accent3)}.tag.recent{background:rgba(76,175,130,0.12);color:var(--green)}
    .card-date{font-size:11px;color:var(--muted);margin-top:12px}
    .card-actions{display:flex;gap:8px;margin-top:14px;opacity:0;transform:translateY(6px);transition:all 0.18s}
    .card:hover .card-actions{opacity:1;transform:translateY(0)}
    .act-btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s,border-color 0.15s;text-align:center}
    .act-btn:hover{background:rgba(124,110,247,0.15);border-color:var(--accent);color:var(--accent)}
    .act-btn.open{background:rgba(124,110,247,0.12);border-color:rgba(124,110,247,0.3);color:var(--accent)}
    .act-btn.open:hover{background:var(--accent);color:#fff}
    #empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
    #empty .e-icon{font-size:48px;margin-bottom:16px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:480px;box-shadow:0 24px 80px rgba(0,0,0,0.6);animation:slideUp 0.25s ease}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal h2{font-size:20px;font-weight:700;margin-bottom:24px}
    .field{margin-bottom:18px}
    .field label{font-size:13px;color:var(--muted);display:block;margin-bottom:7px;font-weight:500}
    .field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s}
    .field input:focus,.field select:focus{border-color:var(--accent)}
    .field select option{background:var(--surface2)}
    .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
    .modal-actions{display:flex;gap:10px;margin-top:24px}
    .modal-cancel{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:12px;font-size:14px;font-family:inherit;cursor:pointer;transition:border-color 0.15s}
    .modal-cancel:hover{border-color:var(--accent);color:var(--text)}
    .modal-create{flex:2;background:linear-gradient(135deg,var(--accent),#5b52d8);border:none;border-radius:10px;color:#fff;padding:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(124,110,247,0.3);transition:transform 0.15s}
    .modal-create:hover{transform:translateY(-1px)}
    .toast{position:fixed;bottom:28px;right:28px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,0.4);opacity:0;transform:translateY(10px);transition:all 0.3s;z-index:200;pointer-events:none;max-width:340px;white-space:pre-line}
    .toast.show{opacity:1;transform:translateY(0)}
  </style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">🚀</div>
    <div><h1>My Projects</h1><p>All your work, in one place</p></div>
  </div>
  <button class="new-btn" onclick="openModal()">＋ &nbsp;New Project</button>
</header>
<div class="stats">
  <div class="stat-card a"><div class="val" id="total-count">0</div><div class="lbl">Total Projects</div></div>
  <div class="stat-card b"><div class="val" id="recent-count">0</div><div class="lbl">Recent</div></div>
  <div class="stat-card c"><div class="val" id="flutter-count">0</div><div class="lbl">Flutter Apps</div></div>
</div>
<div class="toolbar">
  <div class="search-wrap"><span>🔍</span><input id="search" type="text" placeholder="Search projects..." oninput="filterCards()"/></div>
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('flutter',this)">📱 Flutter</button>
  <button class="filter-btn" onclick="setFilter('web',this)">🌐 Web</button>
  <button class="filter-btn" onclick="setFilter('design',this)">🎨 Design</button>
</div>
<div class="section-title">📌 Your Projects</div>
<div class="grid" id="grid"></div>
<div id="empty"><div class="e-icon">🔎</div><p>No projects match.</p></div>

<div class="overlay" id="modal" onclick="closeOnBg(event)">
  <div class="modal">
    <h2>🆕 Add New Project</h2>
    <div class="field"><label>Project Name</label><input id="new-name" type="text" placeholder="e.g. MyApp"/></div>
    <div class="field">
      <label>Type</label>
      <select id="new-type">
        <option value="flutter">📱 Flutter App</option>
        <option value="web">🌐 Web App</option>
        <option value="design">🎨 Design / Assets</option>
        <option value="other">📂 Other</option>
      </select>
    </div>
    <div class="field">
      <label>Project Folder Path</label>
      <input id="new-loc" type="text" placeholder="C:\Users\USER\Projects\MyApp"/>
      <p class="hint">💡 Press <strong>Win + E</strong> → address bar → paste path → Enter to navigate to folder.</p>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-cancel" onclick="addProject(false)" style="background:var(--surface2);border-color:var(--border);color:var(--text)">Add to List</button>
      <button class="modal-create" onclick="addProject(true)">🚀 Create & Open Folder</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const BASE=[
    {name:"MelodyMind",path:"C:\\Users\\USER\\Downloads\\MelodyMind_Clean_Source",type:"flutter",icon:"🎵",color:"#7c6ef7",bg:"rgba(124,110,247,0.12)",date:"Aug 28, 2026",tags:["flutter","recent"]},
    {name:"Round Trip Ready",path:"C:\\Users\\USER\\Downloads\\round-trip-ready-main",type:"flutter",icon:"✈️",color:"#4fc3f7",bg:"rgba(79,195,247,0.12)",date:"Feb 16, 2026",tags:["flutter"]},
    {name:"UniviaPro",path:"C:\\Users\\USER\\Downloads\\univiapro",type:"web",icon:"🎓",color:"#f7a94e",bg:"rgba(247,169,78,0.12)",date:"Feb 24, 2026",tags:["web"]},
    {name:"Convoy",path:"C:\\Users\\USER\\Downloads\\convoy",type:"other",icon:"🚛",color:"#4caf82",bg:"rgba(76,175,130,0.12)",date:"Feb 5, 2026",tags:[]},
    {name:"HAÏTIANFOUD",path:"C:\\Users\\USER\\Downloads\\HAÏTIANFOUD",type:"design",icon:"🎨",color:"#f06292",bg:"rgba(240,98,146,0.12)",date:"Feb 4, 2026",tags:["design"]},
    {name:"Banani UI Export",path:"C:\\Users\\USER\\Downloads\\banani-ui-export",type:"design",icon:"🖌️",color:"#f06292",bg:"rgba(240,98,146,0.12)",date:"Feb 23, 2026",tags:["design"]},
    {name:"Presentation",path:"C:\\Users\\USER\\Downloads\\Presnetation",type:"design",icon:"📊",color:"#ab47bc",bg:"rgba(171,71,188,0.12)",date:"Aug 23, 2026",tags:["design","recent"]},
  ];
  let custom=JSON.parse(localStorage.getItem('myproj')||'[]');
  let filter='all';
  const all=()=>[...BASE,...custom];

  function render(list){
    const g=document.getElementById('grid'),e=document.getElementById('empty');
    g.innerHTML='';
    if(!list.length){e.style.display='block';return;}
    e.style.display='none';
    list.forEach(p=>{
      const c=document.createElement('div');c.className='card';
      c.style.setProperty('--card-color',p.color);c.style.setProperty('--card-bg',p.bg);
      const sp=(p.path||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      c.innerHTML=`<div class="card-icon">${p.icon}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-path" title="${p.path}">${p.path}</div>
        <div class="card-tags">${(p.tags||[]).map(t=>`<span class="tag ${t}">${t}</span>`).join('')}</div>
        <div class="card-date">📅 ${p.date}</div>
        <div class="card-actions">
          <button class="act-btn open" onclick="launchFolder('${sp}', '${(p.name||'').replace(/'/g,"\\'")}')">🚀 Open Folder</button>
          <button class="act-btn" onclick="cp('${sp}')">📋 Copy Path</button>
        </div>`;
      g.appendChild(c);
    });
    const a=all();
    document.getElementById('total-count').textContent=a.length;
    document.getElementById('recent-count').textContent=a.filter(p=>(p.tags||[]).includes('recent')).length;
    document.getElementById('flutter-count').textContent=a.filter(p=>p.type==='flutter').length;
  }
  function filterCards(){
    const q=document.getElementById('search').value.toLowerCase();
    render(all().filter(p=>{
      const ms=p.name.toLowerCase().includes(q)||(p.path||'').toLowerCase().includes(q);
      const mf=filter==='all'||p.type===filter;return ms&&mf;
    }));
  }
  function setFilter(t,btn){filter=t;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filterCards();}
  function cp(path){navigator.clipboard.writeText(path).then(()=>toast('✅ Path copied!\n\nOpen File Explorer → click address bar → Ctrl+V → Enter')).catch(()=>toast('Path: '+path));}
  function openModal(){document.getElementById('modal').classList.add('open');}
  function closeModal(){document.getElementById('modal').classList.remove('open');}
  function closeOnBg(e){if(e.target===document.getElementById('modal'))closeModal();}
  function addProject(openNow = false){
    const name=document.getElementById('new-name').value.trim();
    const type=document.getElementById('new-type').value;
    let loc=document.getElementById('new-loc').value.trim();
    if(!name){toast('⚠️ Enter a project name.');return;}
    if(!loc) loc = 'C:\\Users\\USER\\Projects\\' + name;
    
    const icons={flutter:'📱',web:'🌐',design:'🎨',other:'📂'};
    const colors={flutter:'#4fc3f7',web:'#f7a94e',design:'#f06292',other:'#78909c'};
    const bgs={flutter:'rgba(79,195,247,0.12)',web:'rgba(247,169,78,0.12)',design:'rgba(240,98,146,0.12)',other:'rgba(120,144,156,0.12)'};
    
    const p={name,type,path:loc,icon:icons[type],color:colors[type],bg:bgs[type],
      date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),tags:[type,'recent']};
    custom.push(p);localStorage.setItem('myproj',JSON.stringify(custom));
    closeModal();filterCards();
    
    if(openNow) {
      launchFolder(loc, name);
    } else {
      toast('✅ "'+name+'" added!');
    }
    document.getElementById('new-name').value='';document.getElementById('new-loc').value='';
  }

  function launchFolder(path, name) {
    const batContent = `@echo off\nif not exist "${path}" mkdir "${path}"\nexplorer "${path}"`;
    const blob = new Blob([batContent], { type: 'application/x-msdos-program' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Open_${name.replace(/\s+/g, '_')}.bat`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('🚀 Opening folder launcher for "' + name + '"!\nClick the downloaded file to open Explorer instantly.');
  }

  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000);}

  render(all());
</script>
</body>
</html>
