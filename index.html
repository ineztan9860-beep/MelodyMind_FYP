<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Base href for Flutter Web -->
  <base href="/MelodyMind/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MelodyMind - Interactive Musical Game App. Train your ear, master rhythm, and challenge musical memory.">

  <!-- Responsive & iOS Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MelodyMind">

  <!-- Apple Touch Icons for iOS Home Screen Pinning -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/Icon-120.png">

  <!-- Web App Manifest & Theme Color -->
  <meta name="theme-color" content="#0F172A">
  <meta name="msapplication-TileColor" content="#0F172A">
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/Icon-16.png">

  <title>MelodyMind - Musical Game</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .app-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #F8FAFC;
    }
    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #22D3EE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* iOS Add to Home Screen Banner */
    #ios-pwa-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 14px 16px;
      color: #FFFFFF;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      z-index: 10000;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .ios-banner-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ios-banner-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .ios-banner-text {
      flex: 1;
      font-size: 13px;
      line-height: 1.35;
      color: #E2E8F0;
    }
    .ios-banner-text strong {
      color: #FFFFFF;
      display: block;
      margin-bottom: 2px;
      font-size: 14px;
    }
    .ios-close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #CBD5E1;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Loading Splash Screen -->
  <div id="loading-container">
    <img src="icons/Icon-180.png" alt="MelodyMind" class="app-logo">
    <div class="app-title">MelodyMind</div>
    <div class="app-subtitle">Interactive Musical Game</div>
    <div class="spinner"></div>
  </div>

  <!-- iOS Add to Home Screen Guidance Banner -->
  <div id="ios-pwa-banner">
    <div class="ios-banner-content">
      <img src="icons/Icon-180.png" alt="MelodyMind" class="ios-banner-icon">
      <div class="ios-banner-text">
        <strong>Pin MelodyMind to Home Screen</strong>
        Tap <span style="font-size: 15px;">⎋</span> <b>Share</b> below, then select <b>"Add to Home Screen"</b> ➕ for native fullscreen play!
      </div>
      <button class="ios-close-btn" onclick="dismissIosBanner()">&times;</button>
    </div>
  </div>

  <script>
    // iOS Safari Add-to-Home-Screen Detection
    (function checkIosHomeScreen() {
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      const dismissed = localStorage.getItem('melody_mind_ios_banner_dismissed');

      if (isIos && !isStandalone && !dismissed) {
        // Show banner after short delay
        setTimeout(() => {
          const banner = document.getElementById('ios-pwa-banner');
          if (banner) banner.style.display = 'block';
        }, 1800);
      }
    })();

    function dismissIosBanner() {
      const banner = document.getElementById('ios-pwa-banner');
      if (banner) banner.style.display = 'none';
      localStorage.setItem('melody_mind_ios_banner_dismissed', 'true');
    }

    // Dismiss loading container once Flutter paints
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>

  <!-- Flutter Web Bootstrapper -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
